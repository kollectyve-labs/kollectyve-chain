[package]
name = "kollectyve-runtime"
description = "Kollectyve network runtime built with Substrate."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[dependencies]
array-bytes = { workspace = true }
codec = { features = ["derive"], workspace = true }
pallet-kollectyve-id.workspace = true
pallet-kollectyve-policy.workspace = true
pallet-kollectyve-credentials.workspace = true
pallet-kumulus.workspace = true
polkadot-sdk = { workspace = true, features = [
    "frame-executive",
    "frame-metadata-hash-extension",
    "frame-support",
    "frame-system",
    "frame-system-benchmarking",
    "frame-system-rpc-runtime-api",
    "frame-try-runtime",
    "frame-benchmarking",
    "pallet-aura",
    "pallet-balances",
    "pallet-grandpa",
    "pallet-multisig",
    "pallet-revive",
    "pallet-sudo",
    "pallet-timestamp",
    "pallet-transaction-payment",
    "pallet-transaction-payment-rpc-runtime-api",
    "runtime",
    "sp-api",
    "sp-block-builder",
    "sp-consensus-aura",
    "sp-consensus-grandpa",
    "sp-core",
    "sp-genesis-builder",
    "sp-inherents",
    "sp-io",
    "sp-keyring",
    "sp-offchain",
    "sp-runtime",
    "sp-session",
    "sp-storage",
    "sp-transaction-pool",
    "sp-version",
    "staging-xcm",
    "staging-xcm-builder",
    # Required by the tracing runtime APIs that
    # `pallet_revive::impl_runtime_apis_plus_revive_traits!` generates (debug_trace*).
    "with-tracing",
], default-features = false }
scale-info = { features = ["derive", "serde"], workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"pallet-kollectyve-id/std",
	"pallet-kollectyve-policy/std",
	"pallet-kollectyve-credentials/std",
	"pallet-kumulus/std",
	"polkadot-sdk/std",
	"scale-info/std",
	"serde_json/std",
	"substrate-wasm-builder",
]

runtime-benchmarks = [
	"pallet-kollectyve-id/runtime-benchmarks",
	"pallet-kollectyve-policy/runtime-benchmarks",
	"pallet-kollectyve-credentials/runtime-benchmarks",
	"pallet-kumulus/runtime-benchmarks",
	"polkadot-sdk/runtime-benchmarks",
]

try-runtime = [
	"pallet-kollectyve-id/try-runtime",
	"pallet-kollectyve-policy/try-runtime",
	"pallet-kollectyve-credentials/try-runtime",
	"pallet-kumulus/try-runtime",
	"polkadot-sdk/try-runtime",
]

# Enable the metadata hash generation.
#
# This is hidden behind a feature because it increases the compile time.
# The wasm binary needs to be compiled twice, once to fetch the metadata,
# generate the metadata hash and then a second time with the
# `RUNTIME_METADATA_HASH` environment variable set for the `CheckMetadataHash`
# extension.
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

# A convenience feature for enabling things when doing a build
# for an on-chain release.
on-chain-release-build = ["metadata-hash"]
